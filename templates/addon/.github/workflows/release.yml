# Package a tagged release (git tag vX.Y.Z) with the BigWigs packager for the Forever flavor and attach the zip to
# a GitHub Release. CurseForge and Wago uploads happen only when the CF_API_KEY / WAGO_API_TOKEN secrets exist in
# this repo (Settings > Secrets and variables > Actions).
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: BigWigsMods/packager@v2
        with:
          args: -g forever
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
